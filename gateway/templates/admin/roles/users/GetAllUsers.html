<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Пользователи</title>
    <link rel="stylesheet" href="/static/css/admin/roles/users/GetAllUsers.css">
</head>
<body>

<h2>Список пользователей</h2>

<table>
    <thead>
        <tr>
            <th>Email</th>
            <th>Имя</th>
            <th>Фамилия</th>
            <th>Возраст</th>
            <th>Пол</th>
            <th>Админ</th>
            <th>Действия</th>
        </tr>
    </thead>

    <tbody>
        {{ range .Users }}
        <tr>
            <td>{{ .Email }}</td>
            <td>{{ .Firstname }}</td>
            <td>{{ .Lastname }}</td>
            <td>{{ .Age }}</td>
            <td>{{ .Sex }}</td>
            <td>{{ if .Adm }}Да{{ else }}Нет{{ end }}</td>

            <td>
                <form method="POST" action="/adm/users">
                    <input type="hidden" name="email" value="{{ .Email }}">

                    <div class="actions">
                        {{ if not .Adm }}
                        <button class="green" name="action" value="make_admin">
                            Сделать админом
                        </button>
                        {{ else }}
                        <button class="orange" name="action" value="remove_admin">
                            Убрать админа
                        </button>
                        {{ end }}

                        <button class="red" name="action" value="delete">
                            Удалить
                        </button>
                        <button class="blue" name="action" value="history">
                            История
                        </button>
                    </div>
                </form>
            </td>
        </tr>
        {{ else }}
        <tr>
            <td colspan="7">Нет пользователей</td>
        </tr>
        {{ end }}
    </tbody>
</table>

</body>
</html>
