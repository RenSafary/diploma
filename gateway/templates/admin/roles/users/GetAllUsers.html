<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Пользователи</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }
    </style>
</head>
<body>

<h2>Список пользователей</h2>

<table>
    <thead>
        <tr>
            <th>Email</th>
            <th>Имя</th>
            <th>Фамилия</th>
            <th>Возраст</th>
            <th>Пол</th>
            <th>Админ</th>
        </tr>
    </thead>

    <tbody>
        {{ range .Users }}
        <tr>
            <td>{{ .Email }}</td>
            <td>{{ .Firstname }}</td>
            <td>{{ .Lastname }}</td>
            <td>{{ .Age }}</td>
            <td>{{ .Sex }}</td>
            <td>{{ if .Adm }}Да{{ else }}Нет{{ end }}</td>
        </tr>
        {{ else }}
        <tr>
            <td colspan="6">Нет пользователей</td>
        </tr>
        {{ end }}
    </tbody>
</table>

</body>
</html>
